# CI: format/vet/build/test on every push and PR; on main and version tags,
# additionally build the Docker image (VERSION stamped from git describe, same
# as the Makefile) and push it to GHCR for pull-based deploys.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The lease/CAS and SKIP LOCKED tests run against a real database; pgvector
      # because migrations create the vector extension. Without TEST_DATABASE_URL
      # they'd skip, so this service is what makes CI actually cover them.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/tracker_test?sslmode=disable
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git describe --tags works
      - name: version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cut the GitHub Release from the tag itself, so `git push origin vX.Y.Z` is the
  # whole ritual. Runs after `image`, so a release never points at a version that
  # failed to publish.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # job-level, and it replaces the read-only default above
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag objects, so the annotation below is readable
      - name: create release from the tag annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # Re-running a workflow must not fail on an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi

          # An annotated tag carries the notes: first line is the title, the rest
          # is the body. Test the object type rather than the string — for a
          # lightweight tag %(contents:subject) silently yields the *commit*
          # subject, so an emptiness check would title the release with whatever
          # the last commit happened to say (v1.3.0 is such a tag).
          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "lightweight tag; generating notes from merged PRs instead"
            gh release create "$tag" --title "$tag" --generate-notes
          else
            subject="$(git tag -l --format='%(contents:subject)' "$tag")"
            body="$(git tag -l --format='%(contents:body)' "$tag")"
            printf '%s' "$body" | gh release create "$tag" --title "$subject" --notes-file -
          fi
