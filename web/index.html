<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracker</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
  :root {
    --bg:#0f1115;
    --panel:#171a21;
    --border:#262b36;
    --fg:#d7dce5;
    --muted:#8a93a3;
    --accent:#6ea8fe;
    --lock:#e0a458;
    --input-bg:#0c0e12;
    --btn-bg:#222733;
    --btn-hover-bg:#2b3240;
    --item-hover-bg:#1d2230;
    --item-active-bg:#202739;
    --link:#6ea8fe;
    --link-visited:#c398ff;
  }
  :root.light-mode {
    --bg:#f8f9fa;
    --panel:#ffffff;
    --border:#dee2e6;
    --fg:#212529;
    --muted:#6c757d;
    --accent:#0d6efd;
    --lock:#d97706;
    --input-bg:#e9ecef;
    --btn-bg:#f8f9fa;
    --btn-hover-bg:#e9ecef;
    --item-hover-bg:#f1f3f5;
    --item-active-bg:#e8f0fe;
    --link:#0d6efd;
    --link-visited:#6f42c1;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.6rem; align-items:center; padding:.55rem .8rem; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; margin:0 .5rem 0 0; font-weight:600; letter-spacing:.5px; }
  header input, header select { background:var(--input-bg); border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:.35rem .5rem; font-size:13px; }
  header select { cursor:pointer; max-width:170px; text-overflow:ellipsis; }
  header select:focus, header input:focus { outline:none; border-color:var(--accent); }
  header select option { background:var(--panel); color:var(--fg); }
  #q { flex:1; }
  #actor { width:140px; }
  #token { width:170px; }
  button { background:var(--btn-bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:.35rem .6rem; cursor:pointer; }
  button:hover { background:var(--btn-hover-bg); }
  main { flex:1; display:flex; min-height:0; }
  #sidebar { width:300px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  body.no-sidebar #sidebar { display: none; }
  #sidebar-edge { flex:0 0 24px; padding-top:.55rem; background:var(--panel); border-right:1px solid var(--border); }
  #sidebar-toggle { width:100%; height:32px; padding:0; border:0; border-radius:0; background:transparent; color:var(--muted); font-size:24px; line-height:1; }
  #sidebar-toggle:hover { background:var(--btn-hover-bg); color:var(--fg); }
  #sidebar-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  #filter-container {
    padding: .55rem .7rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  #filter { width:100%; background:var(--input-bg); border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:.35rem .5rem; font-size:13px; }
  .sort-controls {
    display: flex;
    gap: .4rem;
    align-items: center;
  }
  .sort-btn-group {
    display: flex;
    gap: 2px;
    flex: 1;
  }
  .sort-toggle {
    flex: 1;
    width: auto !important;
  }
  #sort-dir {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 0 2px 0;
    font-size: 13px;
    border-radius: 6px;
    line-height: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
  }
  #filter:focus { outline:none; border-color:var(--accent); }
  #list { flex:1; overflow:auto; }
  mark.highlight { background:rgba(110, 168, 254, 0.25); color:#9ec5fe; border-radius:2px; padding:0 1px; }
  :root.light-mode mark.highlight { background:rgba(13, 110, 253, 0.15); color:var(--accent); }
  .item { padding:.5rem .7rem; border-bottom:1px solid var(--border); cursor:pointer; }
  .item:hover { background:var(--item-hover-bg); }
  .item.active { background:var(--item-active-bg); border-left:2px solid var(--accent); }
  .item .title { font-weight:600; }
  .item .meta { color:var(--muted); font-size:12px; display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
  .badge { font-size:10.5px; padding:.05rem .35rem; border-radius:4px; border:1px solid var(--border); color:var(--muted); }
  .lock { color:var(--lock); border-color:var(--lock); }
  #view { flex:1; overflow:auto; padding:1.2rem 1.6rem; }
  #docmeta { color:var(--muted); font-size:12px; margin-bottom:1rem; padding-bottom:.6rem; border-bottom:1px solid var(--border); display:flex; gap:.7rem; flex-wrap:wrap; align-items:center; }
  #doc-actions { display:flex; align-items:center; gap:.7rem; margin-left:auto; }
  #rawbtn { display:inline-flex; align-items:center; gap:.45rem; padding:.15rem 0; border:0; background:transparent; font:inherit; color:var(--muted); white-space:nowrap; }
  #rawbtn .switch-track { position:relative; width:30px; height:16px; border-radius:8px; background:var(--border); }
  #rawbtn .switch-thumb { position:absolute; width:12px; height:12px; top:2px; left:2px; border-radius:50%; background:var(--fg); }
  #rawbtn[aria-checked="true"] .switch-track { background:var(--accent); }
  #rawbtn[aria-checked="true"] .switch-thumb { transform:translateX(14px); background:var(--panel); }
  #rawbtn[aria-checked="false"] .rendered-label, #rawbtn[aria-checked="true"] .raw-label { color:var(--fg); font-weight:600; }
  #rawbtn:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:3px; }
  #copybtn { font:inherit; min-width:6.5em; padding:.2rem .5rem; white-space:nowrap; }
  #copybtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .md h1,.md h2,.md h3 { line-height:1.25; }
  .md img { max-width:100%; height:auto; }
  .attachment { margin:.2rem 0 1rem; }
  .attachment img { max-width:100%; max-height:75vh; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); }
  .attachment iframe { width:100%; height:75vh; border:1px solid var(--border); border-radius:6px; }
  .filecard { display:flex; align-items:center; gap:.8rem; padding:.7rem .9rem; border:1px solid var(--border); border-radius:6px; background:var(--panel); }
  .filecard .icon { font-size:1.6rem; }
  .filecard a { color:var(--accent); }
  .card-preview img { max-height:140px; max-width:100%; border-radius:4px; }
  .card-preview:has(img) { mask-image:none; -webkit-mask-image:none; max-height:none; }
  #attachbtn, #embedbtn { font:inherit; padding:.2rem .5rem; white-space:nowrap; }
  #view.dropping { outline:2px dashed var(--accent); outline-offset:-8px; }
  #notice { position:fixed; bottom:1rem; right:1rem; max-width:32rem; padding:.6rem .9rem; border-radius:6px; background:var(--panel); border:1px solid var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.25); display:none; z-index:50; }
  .md pre { background:var(--input-bg); border:1px solid var(--border); padding:.7rem; border-radius:6px; overflow:auto; }
  .md code { background:var(--input-bg); padding:.1rem .3rem; border-radius:4px; }
  .md pre code { background:none; padding:0; }
  .rawview { background:var(--input-bg); border:1px solid var(--border); padding:.7rem; border-radius:6px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:0; }
  .md table { border-collapse:collapse; } .md th,.md td { border:1px solid var(--border); padding:.3rem .5rem; }
  .md blockquote { border-left:3px solid var(--border); margin:0; padding-left:.8rem; color:var(--muted); }
  .md a { color: var(--link); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md a:visited { color: var(--link-visited); }
  .empty { color:var(--muted); margin-top:3rem; text-align:center; }
  .muted { color:var(--muted); }
  #histbtn { cursor:pointer; }
  #histbtn:hover { color:var(--accent); border-color:var(--accent); }
  #histpanel:not(:empty) { margin-bottom:1rem; border:1px solid var(--border); border-radius:6px; }
  .lrow { display:flex; gap:.6rem; align-items:center; padding:.35rem .55rem; border-bottom:1px solid var(--border); cursor:pointer; font-size:12.5px; }
  .lrow:last-child { border-bottom:0; }
  .lrow:hover { background:var(--item-hover-bg); }
  .lrow.active { background:var(--item-active-bg); }
  .lrow .title { font-weight:600; }
  .badge.cur { color:var(--accent); border-color:var(--accent); }
  .segmented-control {
    display: flex;
    position: relative;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    user-select: none;
    font-size: 12px;
    width: 130px;
    height: 24px;
    align-items: stretch;
  }
  .segmented-control input {
    display: none;
  }
  .segmented-control label {
    flex: 1;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    color: var(--muted);
    transition: color 0.15s ease;
  }
  .segmented-control input:checked + label {
    color: var(--fg);
    font-weight: 600;
  }
  .segmented-control .slider {
    position: absolute;
    top: 2px;
    bottom: 2px;
    left: 2px;
    width: calc(50% - 2px);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }
  .segmented-control input#scope-folios:checked ~ .slider,
  .segmented-control input#sort-alpha:checked ~ .slider {
    transform: translateX(100%);
  }
  .desc { color:var(--muted); font-size:12px; margin-top:.15rem; }
  .oldbanner { background:var(--item-active-bg); border:1px solid var(--accent); padding:.4rem .65rem; border-radius:6px; margin-bottom:1rem; font-size:13px; }
  .oldbanner a { color:var(--link); cursor:pointer; }
  
  .folio-sublist {
    margin-top: .4rem;
    padding-left: 1.2rem;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: .25rem;
  }
  .sub-item {
    padding: .3rem .4rem;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-item:hover {
    color: var(--fg);
    background: var(--item-hover-bg);
  }
  .sub-item.active {
    color: var(--accent);
    background: var(--btn-hover-bg);
    font-weight: 600;
  }
  .folio-file-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem 1rem;
    margin-bottom: .8rem;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .folio-file-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    background: var(--item-hover-bg);
  }
  .card-header {
    display: flex;
    gap: .6rem;
    align-items: center;
    font-size: 13px;
    margin-bottom: .4rem;
  }
  .card-preview {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
    white-space: pre-wrap;
    max-height: 80px;
    overflow: hidden;
    position: relative;
    mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
  }
  .home { max-width: 820px; margin: 0 auto; padding: .4rem 0 2.5rem; }
  .home-head { display: flex; flex-wrap: wrap; gap: .5rem .7rem; align-items: center; color: var(--muted); font-size: 12px; padding-bottom: .75rem; border-bottom: 1px solid var(--border); }
  .home-head code { background: var(--input-bg); padding: .12rem .38rem; border-radius: 4px; color: var(--fg); }
  .home-links { display: flex; gap: .8rem; margin-left: auto; }
  .home-links a { color: var(--link); text-decoration: none; }
  .home-links a:hover { text-decoration: underline; }
  .home-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; margin: 1.1rem 0 .35rem; }
  .home-lede { color: var(--muted); margin: 0 0 1.5rem; font-size: 14.5px; max-width: 64ch; }
  .home-section { margin: 1.6rem 0; }
  .home-section h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .65rem; font-weight: 600; }
  .home-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .85rem 1rem; }
  .home-cmd-bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .55rem; font-size: 12px; color: var(--muted); }
  .home-copy { font: inherit; min-width: 5.5em; padding: .2rem .55rem; font-size: 12px; }
  .home-copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .home-cmd { background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; padding: .7rem .85rem; margin: 0; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
  .home-note { color: var(--muted); font-size: 12.5px; margin: .6rem 0 0; line-height: 1.5; }
  .home-note code, .home-card code, .home-concepts code, .home-footer code { background: var(--input-bg); padding: .08rem .3rem; border-radius: 4px; font-size: .92em; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem; }
  .home-card h3 { font-size: 13.5px; margin: 0 0 .35rem; font-weight: 600; }
  .home-card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .home-concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .6rem .9rem; margin: 0; padding: .85rem 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .home-concept { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .home-concept strong { color: var(--fg); font-weight: 600; }
  .home-footer { margin-top: 2rem; padding-top: .9rem; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: center; }
  .home-footer-links { display: flex; gap: .9rem; }
  .home-footer a { color: var(--link); text-decoration: none; }
  .home-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1 id="home" title="home / help">tracker</h1>
  <div class="segmented-control">
    <input type="radio" id="scope-all" name="scope" value="all" checked>
    <label for="scope-all">docs</label>
    <input type="radio" id="scope-folios" name="scope" value="folios">
    <label for="scope-folios">folios</label>
    <div class="slider"></div>
  </div>
  <select id="workspace" title="Switch workspace"></select>
  <input id="q" placeholder="search…" autocomplete="off">
  <input id="actor" placeholder="actor ID" autocomplete="off">
  <input id="token" placeholder="bearer token (if set)" autocomplete="off">
  <button id="help">? help</button>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button id="refresh">↻</button>
</header>
<noscript>
  This is tracker's human web UI and needs JavaScript. Agents: use POST /mcp,
  the JSON API (GET /docs, GET /folios), /openapi.yaml, or /llms.txt (also
  served at this URL with ?format=md).
</noscript>
<main>
  <div id="sidebar">
    <div id="filter-container">
      <input id="filter" placeholder="filter list…" autocomplete="off">
      <div class="sort-controls">
        <span class="muted" style="font-size: 12px;">sort:</span>
        <div class="sort-btn-group">
          <div class="segmented-control sort-toggle">
            <input type="radio" id="sort-date" name="sort-type" value="date" checked>
            <label for="sort-date">date</label>
            <input type="radio" id="sort-alpha" name="sort-type" value="alpha">
            <label for="sort-alpha">alpha</label>
            <div class="slider"></div>
          </div>
          <button id="sort-dir" title="toggle sort direction">↓</button>
        </div>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="sidebar-edge">
    <button id="sidebar-toggle" title="Hide sidebar" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true">‹</button>
  </div>
  <div id="view"></div>
  <div id="notice" role="status"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const actorBox = $("#actor");
actorBox.value = localStorage.getItem("tracker_actor") || "";
actorBox.addEventListener("change", async () => {
  localStorage.setItem("tracker_actor", actorBox.value.trim());
  await loadWorkspaces();
  loadList();
  if (active) openDoc(active);
  else if (activeFolio) openFolio(activeFolio);
  else showHelp();
});

const tokenBox = $("#token");
tokenBox.value = localStorage.getItem("tracker_token") || "";
tokenBox.addEventListener("change", async () => {
  localStorage.setItem("tracker_token", tokenBox.value.trim());
  await loadWorkspaces();
  loadList();
  if (active) openDoc(active);
  else if (activeFolio) openFolio(activeFolio);
  else showHelp();
});

const workspaceSelect = $("#workspace");
const urlWorkspace = new URLSearchParams(location.search).get("workspace") || "";
let currentWorkspace = urlWorkspace || localStorage.getItem("tracker_workspace") || "";

// The workspace lives in the URL, so a copied link opens in the workspace it was
// copied from. The hash (#/doc/…) is left alone.
function syncUrlWorkspace(ws) {
  const params = new URLSearchParams(location.search);
  if (ws) params.set("workspace", ws); else params.delete("workspace");
  const search = params.toString();
  const url = location.pathname + (search ? "?" + search : "") + location.hash;
  if (url !== location.pathname + location.search + location.hash) history.replaceState(null, "", url);
}

// The server's default workspace: what a request without X-Workspace lands in.
async function serverDefaultWorkspace() {
  try {
    const h = headers();
    delete h["X-Workspace"];
    const r = await fetch("/docs?limit=1&view=table", { headers: h });
    return r.headers.get("X-Workspace") || "";
  } catch (e) { return ""; }
}

function headers() {
  const h = {};
  const actor = actorBox.value.trim();
  if (actor) h["X-Actor"] = actor;
  const t = tokenBox.value.trim();
  if (t) h["Authorization"] = "Bearer " + t;
  const ws = (workspaceSelect && workspaceSelect.value) ? workspaceSelect.value.trim() : (currentWorkspace || "");
  if (ws) h["X-Workspace"] = ws;
  return h;
}
async function api(path) {
  const r = await fetch(path, { headers: headers() });
  if (!r.ok) throw new Error("HTTP " + r.status + " on " + path);
  const serverWs = r.headers.get("X-Workspace");
  if (serverWs && workspaceSelect && workspaceSelect.value !== serverWs) {
    if ([...workspaceSelect.options].some(o => o.value === serverWs)) {
      workspaceSelect.value = serverWs;
      currentWorkspace = serverWs;
      localStorage.setItem("tracker_workspace", serverWs);
      syncUrlWorkspace(serverWs);
    }
  }
  return r;
}
// apiAll walks a paged list endpoint to the end and returns the items under key.
// The browser wants whole folios; agents get one small page by default.
async function apiAll(path, key) {
  const sep = path.includes("?") ? "&" : "?";
  const items = [];
  for (;;) {
    const page = await (await api(`${path}${sep}limit=200&offset=${items.length}`)).json();
    items.push(...page[key]);
    if (!page[key].length || items.length >= page.total) return items;
  }
}

async function loadWorkspaces() {
  let res;
  try {
    res = await api("/workspaces");
  } catch (e) {
    try {
      const h = headers();
      delete h["X-Workspace"];
      const r = await fetch("/workspaces", { headers: h });
      if (r.ok) res = r;
    } catch {}
  }
  if (!res) {
    if (!workspaceSelect.children.length) {
      const opt = document.createElement("option");
      const val = currentWorkspace || "default";
      opt.value = val;
      opt.textContent = `ws: ${val}`;
      workspaceSelect.appendChild(opt);
    }
    return;
  }
  try {
    const { workspaces } = await res.json();
    if (!workspaces || !workspaces.length) return;

    // A browser that only ever saw the old built-in default follows the server's
    // default; an explicit choice (or a ?workspace= link) is kept.
    if (!urlWorkspace && currentWorkspace === "default") {
      const serverDefault = await serverDefaultWorkspace();
      if (serverDefault && serverDefault !== "default") currentWorkspace = serverDefault;
    }
    const prev = currentWorkspace || workspaceSelect.value;
    workspaceSelect.innerHTML = "";

    let selectedVal = "";
    for (const ws of workspaces) {
      const opt = document.createElement("option");
      opt.value = ws.name;
      opt.textContent = `ws: ${ws.name}`;
      if (ws.description) opt.title = ws.description;
      if (ws.name === prev) {
        opt.selected = true;
        selectedVal = ws.name;
      }
      workspaceSelect.appendChild(opt);
    }

    if (!selectedVal && workspaces.length > 0) {
      const serverDefault = await serverDefaultWorkspace();
      const defOpt = workspaces.find(w => w.name === serverDefault) || workspaces.find(w => w.name === "default") || workspaces[0];
      workspaceSelect.value = defOpt.name;
      selectedVal = defOpt.name;
    }
    currentWorkspace = selectedVal;
    localStorage.setItem("tracker_workspace", currentWorkspace);
    syncUrlWorkspace(currentWorkspace);
  } catch (e) {}
}

workspaceSelect.addEventListener("change", () => {
  currentWorkspace = workspaceSelect.value;
  localStorage.setItem("tracker_workspace", currentWorkspace);
  syncUrlWorkspace(currentWorkspace);
  active = activeSlug = activeFolio = null;
  setRoute("");
  loadList();
  showHelp();
});

let active = null, activeSlug = null, activeFolio = null, scope = "all";
let activeDoc = null; // the open doc's metadata, for attachment-aware views
function human(n) { n = +n || 0; return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " kb"; }

// --- routing -----------------------------------------------------------------
// The URL mirrors what you're looking at, so a view can be shared or reopened on
// another machine: #/doc/<slug>, #/doc/<slug>?v=<version> (a past version) and
// #/folio/<slug>. Slugs, not UUIDs — a UUID in
// a URL tells a human nothing. Hash-based because the SPA is only served at "/",
// so a real path would 404 on reload.
//
// Folio-file slugs contain "/" (folio/file.md), so encode per segment: that keeps
// the slash readable as a separator while still escaping spaces and the like.
const encSlug = s => String(s).split("/").map(encodeURIComponent).join("/");
const decSlug = s => String(s).split("/").map(decodeURIComponent).join("/");

// Attachments: anything that isn't text is stored byte for byte and shown as an
// image, a PDF or a download card. Mirrors isTextType on the server, except that
// images (SVG included) are always images here, never text to render.
const TEXT_TYPE = /^(text\/|application\/(json|xml|yaml|x-yaml|toml|javascript|x-ndjson|sql)\b)|\+(json|xml|yaml)\b/;
const isImage = ct => /^image\//.test(ct || "");
const isText = ct => !ct || (!isImage(ct) && TEXT_TYPE.test(ct));
// Types a browser runs as a page. They are shown only through <img> (which never
// runs script) or downloaded: a blob: URL would run them as this origin, outside
// the sandbox the server puts on them.
const ACTIVE_TYPE = /^(text\/html|application\/xhtml\+xml|image\/svg\+xml)\b|[\/+]xml\b/;
const isActive = ct => ACTIVE_TYPE.test(ct || "");
const fileIcon = ct => isText(ct) ? "📄" : isImage(ct) ? "🖼" : "📎";
const wsParam = () => { const ws = headers()["X-Workspace"]; return ws ? "?workspace=" + encodeURIComponent(ws) : ""; };
// By UUID, like the server's embeds: survives renames and needs no slug escaping.
const rawSrc = d => "/docs/" + encodeURIComponent(d.id) + "/raw" + wsParam();
// Markdown link parts: a destination with nothing that ends or breaks it, and a
// label escaped just enough to stay one label. Image alt text is shown verbatim
// (marked keeps other backslashes there); link text also needs emphasis escaped.
const mdDest = u => u.replace(/[\s()<>\\`]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0"));
const mdLabel = (t, image) => String(t).replace(/\s+/g, " ").replace(image ? /[\\\[\]]/g : /[\\\[\]*_`]/g, "\\$&");
function embedFor(d) {
  const image = isImage(d.content_type);
  return `${image ? "!" : ""}[${mdLabel(d.title || d.slug.split("/").pop(), image)}](${mdDest(rawSrc(d))})`;
}

// Files are fetched with the UI's own headers: bearer token, actor (servers with
// REQUIRE_ACTOR gate reads on it) and workspace. An <img>, <iframe> or link can
// send none of those, so they get a blob: URL instead. One fetch per URL per view;
// the URLs are revoked when the view changes.
let fileCache = new Map();
function releaseFiles() {
  for (const p of fileCache.values()) p.then(f => f && URL.revokeObjectURL(f.url), () => {});
  fileCache = new Map();
}
// The server honours X-Workspace over ?workspace=, so a URL that names its
// workspace (an embed from another workspace) must send that one, not the UI's.
function fileHeaders(src) {
  const h = headers();
  const ws = new URL(src, location.origin).searchParams.get("workspace");
  if (ws) h["X-Workspace"] = ws;
  return h;
}
function fetchFile(src) {
  if (!fileCache.has(src)) {
    fileCache.set(src, (async () => {
      const r = await fetch(src, { headers: fileHeaders(src) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      return { blob, type: (r.headers.get("Content-Type") || blob.type || "").split(";")[0].trim(), url: URL.createObjectURL(blob) };
    })());
  }
  return fileCache.get(src);
}
// Save a file to disk. Active types are re-typed so the browser can't render them.
async function downloadFile(src, name) {
  const f = await fetchFile(src);
  // A name taken from link text may lack an extension; take it from the type.
  if (!/\.[a-z0-9]{1,8}$/i.test(name) && f.type.includes("/"))
    name += "." + f.type.split("/")[1].split("+")[0].replace("jpeg", "jpg").replace("plain", "txt");
  const blob = isActive(f.type) ? new Blob([f.blob], { type: "application/octet-stream" }) : f.blob;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
// Open a file in a new tab. The tab is opened during the click (so it isn't
// blocked as a popup) and pointed at the bytes once they arrive; active types
// are downloaded instead.
async function openFile(src, name) {
  const tab = window.open("", "_blank");
  try {
    const f = await fetchFile(src);
    if (isActive(f.type)) { if (tab) tab.close(); return downloadFile(src, name); }
    if (tab) { tab.opener = null; tab.location = f.url; }
  } catch (e) { if (tab) tab.close(); notify(`Couldn't open ${esc(name)}: ${esc(e.message)}`); }
}

// d: {slug, title, content_type, size_bytes}; src: where its bytes are served.
function attachmentView(d, src = rawSrc(d)) {
  const name = d.slug.split("/").pop();
  const ct = d.content_type || "";
  const empty = !d.size_bytes;
  const canOpen = !empty && (isImage(ct) && !isActive(ct) || ct === "application/pdf");
  const card = `<div class="filecard"><span class="icon">${fileIcon(ct)}</span>
      <div><strong>${esc(name)}</strong><div class="muted">${esc(ct || "unknown type")} · ${empty ? "empty file" : human(d.size_bytes)}</div></div>
      ${canOpen ? `<a href="#" data-open="${esc(src)}" data-name="${esc(name)}">open</a>` : ""}
      ${empty ? "" : `<a href="#" data-download="${esc(src)}" data-name="${esc(name)}">download</a>`}</div>`;
  if (empty) return card;
  if (isImage(ct)) return `<figure class="attachment"><img data-file="${esc(src)}" alt="${esc(d.title || name)}"></figure>${card}`;
  if (ct === "application/pdf") return `<div class="attachment"><iframe data-file="${esc(src)}" title="${esc(name)}"></iframe></div>${card}`;
  return card;
}

// Wire up a rendered view: attachment previews and card links, plus same-origin
// images and file links inside rendered markdown (sent to the workspace being
// viewed, and fetched with the UI's headers like everything else).
const sameOriginFile = u => /^\/(docs|blobs)\//.test(u || "");
function withWorkspace(u) {
  if (!u.startsWith("/docs/") || /[?&]workspace=/.test(u) || !wsParam()) return u;
  return u + (u.includes("?") ? "&" : "?") + wsParam().slice(1);
}
function hydrateFiles(root) {
  if (!root) return;
  root.querySelectorAll("[data-file]").forEach(async el => {
    try { el.src = (await fetchFile(el.dataset.file)).url; }
    catch (e) {
      if (el.tagName === "IMG") el.alt = (el.alt || "image") + " (couldn't load: " + e.message + ")";
      else el.replaceWith(Object.assign(document.createElement("div"), { className: "empty", textContent: "Couldn't load file: " + e.message }));
    }
  });
  root.querySelectorAll("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); openFile(a.dataset.open, a.dataset.name); });
  root.querySelectorAll("[data-download]").forEach(a => a.onclick = e => {
    e.preventDefault();
    downloadFile(a.dataset.download, a.dataset.name).catch(err => notify(`Download failed: ${esc(err.message)}`));
  });
  root.querySelectorAll(".md a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (!sameOriginFile(href) || !/\/raw(\?|$)/.test(href)) return;
    const name = a.textContent.trim() || decodeURIComponent(href.split("?")[0].replace(/\/raw$/, "").split("/").pop());
    a.onclick = e => { e.preventDefault(); openFile(withWorkspace(href), name); };
  });
}
let noticeTimer = null;
function notify(html, ms = 6000) {
  const n = $("#notice");
  n.innerHTML = html;
  n.style.display = "block";
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { n.style.display = "none"; }, ms);
}
const fileToBase64 = f => new Promise((ok, fail) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => fail(r.error);
  r.readAsDataURL(f);
});
// Upload files next to what's on screen: into the open doc's folio, the open
// folio, or else a shared "attachments" folio. Returns the uploaded docs.
async function uploadFiles(files) {
  files = [...files].filter(f => f && f.size >= 0);
  if (!files.length) return [];
  if (!actorBox.value.trim()) { notify("Set an <strong>actor ID</strong> in the top bar to upload."); return []; }
  const folio = (activeSlug && activeSlug.includes("/") ? activeSlug.split("/")[0] : null) || activeFolio || "attachments";
  const post = (path, body) => fetch(path, { method: "POST", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (folio === "attachments") await post("/folios", { slug: "attachments", title: "Attachments" }); // 409 if it exists: fine
  const done = [], failed = [];
  for (const f of files) {
    if (f.size > 25 << 20) { failed.push(`${esc(f.name)} (over 25 MB)`); continue; }
    const b64 = await fileToBase64(f);
    const dot = f.name.lastIndexOf(".");
    const stem = dot > 0 ? f.name.slice(0, dot) : f.name, ext = dot > 0 ? f.name.slice(dot) : "";
    for (let n = 1; n <= 20; n++) { // a taken filename gets a -2, -3, … suffix
      const filename = (n === 1 ? stem : `${stem}-${n}`) + ext;
      const r = await post("/folios/" + encodeURIComponent(folio) + "/files",
        { filename, title: filename, kind: "attachment", content_base64: b64, content_type: f.type || "" });
      if (r.status === 409) continue;
      const out = await r.json().catch(() => ({}));
      if (r.ok) done.push(out.document); else failed.push(`${esc(f.name)} (${esc(out.error ? out.error.message : "HTTP " + r.status)})`);
      break;
    }
  }
  if (done.length) {
    const embeds = done.map(embedFor).join("\n");
    await writeClipboard(embeds).catch(() => {});
    notify(`Uploaded ${done.length} file${done.length > 1 ? "s" : ""} to 📁 ${esc(folio)}. Embed markdown copied:<br><code>${esc(embeds)}</code>`
      + (failed.length ? `<br>Failed: ${failed.join(", ")}` : ""));
  } else if (failed.length) notify(`Upload failed: ${failed.join(", ")}`);
  return done;
}
function pickFiles() {
  const input = document.createElement("input");
  input.type = "file"; input.multiple = true;
  input.onchange = async () => { const up = await uploadFiles(input.files); if (up.length) refreshAfterUpload(up); };
  input.click();
}
function refreshAfterUpload(uploaded) {
  if (activeFolio && !activeSlug) openFolio(activeFolio);
  else if (!activeSlug) openDoc(uploaded[0].id);
  else loadList();
}

// setRoute is a no-op when the hash already says what we want. That's what lets
// openDoc/openFolio be called both by a click (pushes history) and by applyRoute
// while handling that very hash (pushes nothing) — no re-entrancy guard needed.
function setRoute(hash) {
  if (location.hash === hash) return;
  history.pushState(null, "", hash || location.pathname + location.search);
}

// Drive the UI from the URL: on first load, and on back/forward.
async function applyRoute() {
  const m = /^#\/(doc|folio)\/([^?]+)(?:\?v=(\d+))?$/.exec(location.hash);
  if (!m) {
    scope = "all"; $("#scope-all").checked = true;
    active = activeSlug = activeFolio = null;
    loadList();
    showHelp();
    return;
  }
  const [, kind, rawSlug, v] = m;
  const slug = decSlug(rawSlug);
  if (kind === "folio") {
    scope = "folios"; $("#scope-folios").checked = true;
    openFolio(slug);
    return;
  }
  // A doc whose slug has a "/" is a folio file — show it in its folio's context,
  // so a shared link to one lands you where you'd have been had you clicked in.
  if (slug.includes("/")) {
    scope = "folios"; $("#scope-folios").checked = true;
    activeFolio = slug.split("/")[0];
  } else {
    scope = "all"; $("#scope-all").checked = true;
    activeFolio = null;
  }
  openDoc(slug, v ? +v : null);
}
// popstate covers back/forward and fresh loads; hashchange covers a link pasted
// into the URL bar of an already-open tab. setRoute's no-op guard keeps the two
// from looping when applyRoute itself sets the hash.
window.addEventListener("popstate", applyRoute);
window.addEventListener("hashchange", applyRoute);

function highlight(text, search) {
  const escapedText = esc(text);
  if (!search) return escapedText;
  const escapedSearch = esc(search).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
  const re = new RegExp(`(${escapedSearch})`, 'gi');
  return escapedText.replace(re, '<mark class="highlight">$1</mark>');
}

function renderItem(el, search) {
  const d = el._data;
  if (!d) return;
  if (d.type === "doc") {
    const titleHtml = highlight(d.title, search);
    const slugHtml = highlight(d.slug, search);
    const tagsHtml = d.tags.map(t => `<span class="badge">#${highlight(t, search)}</span>`).join("");
    const kindHtml = highlight(d.kind, search);
    const actorHtml = d.updated_by ? `<span>by ${highlight(d.updated_by, search)}</span>` : "";
    
    let folioBadge = "";
    if (d.slug.includes("/")) {
      const folioSlug = d.slug.split("/")[0];
      folioBadge = `<span class="badge" style="cursor:pointer; border-color:var(--accent); color:var(--accent);" onclick="event.stopPropagation(); showFolioFromDoc('${esc(folioSlug)}')">📁 ${esc(folioSlug)}</span>`;
    }

    el.innerHTML = `<div class="title">${titleHtml}</div>
      <div class="meta">${folioBadge}<span class="badge">${kindHtml}</span><span>v${d.version}</span><span>${slugHtml}</span>${actorHtml}${tagsHtml}</div>`;
  } else if (d.type === "folio") {
    const titleHighlight = highlight(d.title, search);
    const slugHtml = highlight(d.slug, search);
    const descHtml = d.description ? `<div class="desc">${highlight(d.description, search)}</div>` : "";
    const headerEl = el.querySelector(".folio-header");
    if (headerEl) {
      headerEl.innerHTML = `
        <div class="title">📁 ${titleHighlight}</div>
        <div class="meta"><span>${slugHtml}</span></div>
        ${descHtml}
      `;
    }
  }
}

function applyFilter() {
  const search = $("#filter").value.trim().toLowerCase();
  const list = $("#list");
  const items = list.querySelectorAll(".item");
  let anyVisible = false;
  items.forEach(el => {
    const d = el._data;
    if (!d) return;
    let match = false;
    if (!search) {
      match = true;
    } else {
      if (d.type === "doc") {
        match = d.title.toLowerCase().includes(search) ||
                d.slug.toLowerCase().includes(search) ||
                d.kind.toLowerCase().includes(search) ||
                d.tags.some(t => t.toLowerCase().includes(search));
      } else if (d.type === "folio") {
        match = d.title.toLowerCase().includes(search) ||
                d.slug.toLowerCase().includes(search) ||
                d.description.toLowerCase().includes(search);
      }
    }
    if (match) {
      el.style.display = "";
      renderItem(el, search);
      anyVisible = true;
      
      const sublist = el.querySelector(".folio-sublist");
      if (sublist && sublist.style.display !== "none") {
        const subItems = sublist.querySelectorAll(".sub-item");
        subItems.forEach(sub => {
          if (!search || sub.innerText.toLowerCase().includes(search) || sub.title.toLowerCase().includes(search)) {
            sub.style.display = "";
          } else {
            sub.style.display = "none";
          }
        });
      }
    } else {
      el.style.display = "none";
    }
  });
  let noMatchEl = $("#no-filter-match");
  if (!anyVisible && items.length > 0) {
    if (!noMatchEl) {
      noMatchEl = document.createElement("div");
      noMatchEl.id = "no-filter-match";
      noMatchEl.className = "empty";
      noMatchEl.innerText = "No matching items.";
      list.appendChild(noMatchEl);
    }
  } else {
    if (noMatchEl) noMatchEl.remove();
  }
}

function applySort() {
  const list = $("#list");
  const items = Array.from(list.querySelectorAll(".item"));
  if (items.length === 0) return;
  
  const sortType = document.querySelector('input[name="sort-type"]:checked').value;
  const isDesc = $("#sort-dir").innerText === "↓";
  
  items.sort((a, b) => {
    const da = a._data;
    const db = b._data;
    if (!da || !db) return 0;
    
    if (sortType === "date") {
      return isDesc ? db.updated_at - da.updated_at : da.updated_at - db.updated_at;
    } else {
      const nameA = da.title.toLowerCase();
      const nameB = db.title.toLowerCase();
      if (nameA < nameB) return isDesc ? 1 : -1;
      if (nameA > nameB) return isDesc ? -1 : 1;
      return 0;
    }
  });
  
  items.forEach(el => list.appendChild(el));
}

function showFolioFromDoc(folioSlug) {
  $("#scope-folios").checked = true;
  scope = "folios";
  activeFolio = folioSlug;
  active = null;
  loadFolios();
  openFolio(folioSlug);
}

async function toggleFolioExpand(slug) {
  if (activeFolio === slug) {
    activeFolio = null;
    active = null;
    loadFolios();
    showHelp();
  } else {
    activeFolio = slug;
    active = null;
    loadFolios();
    openFolio(slug);
  }
}

async function populateFolioSublist(slug, sublistEl) {
  sublistEl.innerHTML = `<div class="sub-item muted">loading files…</div>`;
  try {
    const files = await apiAll("/folios/" + encodeURIComponent(slug), "files");
    if (!files.length) {
      sublistEl.innerHTML = `<div class="sub-item muted">Empty folio</div>`;
      return;
    }
    sublistEl.innerHTML = "";
    for (const fl of files) {
      const subEl = document.createElement("div");
      subEl.className = "sub-item" + (fl.id === active || fl.slug === activeSlug ? " active" : "");
      subEl.innerText = fileIcon(fl.content_type) + " " + (fl.title || fl.slug.split("/").pop());
      subEl.title = fl.slug;
      subEl.onclick = (e) => {
        e.stopPropagation();
        openDocInFolio(fl.id, slug);
      };
      sublistEl.appendChild(subEl);
    }
    applyFilter();
  } catch (e) {
    sublistEl.innerHTML = `<div class="sub-item muted">${esc(e.message)}</div>`;
  }
}

async function openDocInFolio(docId, folioSlug) {
  activeFolio = folioSlug;
  // openDoc refreshes the list (loadFolios, in this scope) once it knows the doc,
  // so don't load it twice.
  openDoc(docId);
}

async function loadList() {
  if (scope === "folios") return loadFolios();
  const q = encodeURIComponent($("#q").value.trim());
  const list = $("#list");
  try {
    const { documents } = await (await api("/docs?q=" + q)).json();
    if (!documents.length) { list.innerHTML = '<div class="empty">No documents.</div>'; return; }
    list.innerHTML = "";
    for (const d of documents) {
      const el = document.createElement("div");
      // Match on either: a click knows the UUID, a deep link only knows the slug.
      el.className = "item" + (d.id === active || d.slug === activeSlug ? " active" : "");
      el._data = {
        type: "doc",
        title: d.title || d.slug,
        slug: d.slug,
        kind: d.kind,
        version: d.version,
        tags: d.tags || [],
        updated_by: d.updated_by || d.created_by || "",
        updated_at: new Date(d.updated_at).getTime()
      };
      renderItem(el, $("#filter").value.trim());
      el.onclick = () => openDoc(d.id);
      list.appendChild(el);
    }
    applyFilter();
    applySort();
  } catch (e) { list.innerHTML = `<div class="empty">${esc(e.message)}<br><small>set a bearer token?</small></div>`; }
}

async function loadFolios() {
  const list = $("#list");
  try {
    const folios = await apiAll("/folios?view=full", "folios");
    if (!folios.length) { list.innerHTML = '<div class="empty">No folios.</div>'; return; }
    list.innerHTML = "";
    for (const f of folios) {
      const el = document.createElement("div");
      const isExpanded = f.slug === activeFolio;
      el.className = "item folio-item" + (isExpanded ? " active" : "");
      el.id = "folio-" + f.slug;
      el._data = {
        type: "folio",
        title: f.title || f.slug,
        slug: f.slug,
        description: f.metadata && f.metadata.description ? f.metadata.description : "",
        updated_at: new Date(f.updated_at).getTime()
      };
      
      el.innerHTML = `
        <div class="folio-header" style="cursor: pointer;"></div>
        <div class="folio-sublist" style="display: ${isExpanded ? "flex" : "none"};"></div>
      `;
      
      renderItem(el, $("#filter").value.trim());
      
      el.querySelector(".folio-header").onclick = (e) => {
        e.stopPropagation();
        toggleFolioExpand(f.slug);
      };
      
      list.appendChild(el);
      
      if (isExpanded) {
        populateFolioSublist(f.slug, el.querySelector(".folio-sublist"));
      }
    }
    applyFilter();
    applySort();
  } catch (e) { list.innerHTML = `<div class="empty">${esc(e.message)}<br><small>set a bearer token?</small></div>`; }
}

async function openFolio(slug) {
  activeFolio = slug; active = null; activeSlug = null; activeDoc = null;
  releaseFiles();
  setRoute("#/folio/" + encSlug(slug));
  loadFolios();
  const view = $("#view");
  try {
    const { folio: f, files } = await (await api("/folios/" + encodeURIComponent(slug))).json();
    const desc = f.metadata && f.metadata.description ? `<p class="muted" style="margin-bottom: 1.2rem;">${esc(f.metadata.description)}</p>` : "";
    
    let items = "";
    if (files.length) {
      items = files.map(fl => `
        <div class="folio-file-card" data-id="${fl.id}">
          <div class="card-header">
            <strong>${fileIcon(fl.content_type)} ${esc(fl.title || fl.slug.split("/").pop())}</strong>
            <span class="badge">${esc(fl.kind)}</span>
            <span class="muted">v${fl.version} · ${human(fl.size_bytes)} · updated ${new Date(fl.updated_at).toLocaleDateString()}</span>
          </div>
          <div class="card-preview" id="preview-${fl.id}">
            <span class="muted">Loading preview…</span>
          </div>
        </div>
      `).join("");
    } else {
      items = `<div class="empty">No files in this folio.</div>`;
    }
    
    view.innerHTML = `
      <div id="docmeta">
        <strong>📁 ${esc(f.title || f.slug)}</strong>
        <span class="badge">folio</span>
        <span>${files.length} files</span>
        <div id="doc-actions"><button id="attachbtn" title="Add files to this folio (or drop / paste them here)">📎 Attach</button></div>
      </div>
      ${desc}
      <div class="folio-files-list">${items}</div>
    `;
    
    view.querySelectorAll(".folio-file-card").forEach(el => {
      el.onclick = () => openDocInFolio(el.dataset.id, slug);
    });
    $("#attachbtn").onclick = pickFiles;
    
    files.forEach(async fl => {
      const previewEl = $(`#preview-${fl.id}`);
      if (!previewEl) return;
      // Folio listings are summaries: no content_key, and content_type only on
      // attachments. Size says whether there is anything to preview.
      if (!isText(fl.content_type)) {
        previewEl.innerHTML = !fl.size_bytes ? `<span class="muted">${fileIcon(fl.content_type)} ${esc(fl.content_type)} · empty file</span>`
          : isImage(fl.content_type) ? `<img data-file="${esc(rawSrc(fl))}" alt="">`
          : `<span class="muted">📎 ${esc(fl.content_type)} · ${human(fl.size_bytes)}</span>`;
        hydrateFiles(previewEl);
        return;
      }
      if (!fl.size_bytes) {
        previewEl.innerHTML = `<span class="muted"><i>No content.</i></span>`;
        return;
      }
      try {
        const raw = await (await api("/docs/" + fl.id + "/raw")).text();
        let snippet = raw.slice(0, 300);
        if (raw.length > 300) snippet += "…";
        previewEl.innerText = snippet;
      } catch (e) {
        previewEl.innerHTML = `<span class="muted"><i>Error loading preview.</i></span>`;
      }
    });
    
  } catch (e) { view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// Takes a UUID (from a click) or a slug (from a URL) — the API resolves either.
// We fetch first so we always learn the canonical slug, which is what the URL and
// the list highlighting are keyed on.
// version: show that past version in place of the latest (a deep link to one
// revision, e.g. a single agent turn in a fleet pane's history).
async function openDoc(idOrSlug, version = null) {
  const view = $("#view");
  releaseFiles();
  try {
    const { document: d, lock: lk } = await (await api("/docs/" + encSlug(idOrSlug))).json();
    const id = d.id;
    active = d.id;
    activeSlug = d.slug;
    setRoute("#/doc/" + encSlug(d.slug) + (version ? "?v=" + version : ""));
    loadList();
    let body = "";
    lastRaw = null;
    const binary = d.content_key && !isText(d.content_type);
    if (binary) {
      body = attachmentView(d);
    } else if (d.content_key) {
      const raw = await (await api("/docs/" + id + "/raw")).text();
      lastRaw = raw;
      body = renderDoc(raw);
    } else {
      body = `<div class="empty">No content written yet.</div>`;
    }
    const lock = lk ? `<span class="badge lock">🔒 ${esc(lk.owner)} until ${new Date(lk.expires_at).toLocaleTimeString()}</span>` : "";
    const hist = d.version > 1 ? `<span class="badge" id="histbtn" title="version history">⟲ history</span>` : "";
    // Inert when the doc has no content: there is no raw to show.
    const attach = `<button id="attachbtn" title="Attach files next to this doc (or drop / paste them here)">📎 Attach</button>`;
    const actions = binary ? `<div id="doc-actions"><button id="embedbtn" title="Copy markdown that embeds this file">Copy embed</button>${attach}</div>`
      : d.content_key ? `<div id="doc-actions"><button id="rawbtn" role="switch" aria-label="Raw markdown" aria-checked="${rawView}" title="${rawView ? "Show rendered view" : "Show raw markdown"}">
        <span class="rendered-label">Rendered</span>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="raw-label">Raw</span>
      </button><button id="copybtn" title="${rawView ? "Copy raw markdown" : "Copy formatted text"}" aria-live="polite">Copy</button>${attach}</div>` : `<div id="doc-actions">${attach}</div>`;
    const actor = (d.updated_by || d.created_by) ? `<span>by <strong>${esc(d.updated_by || d.created_by)}</strong></span>` : "";
    const tagsHtml = (d.tags && d.tags.length) ? d.tags.map(t => `<span class="badge">#${esc(t)}</span>`).join(" ") : "";
    // Folio files (slug "folio/file") get a link back to their folio in the
    // header — the same navigation the sidebar badge uses.
    const folioSlug = d.slug.includes("/") ? d.slug.split("/")[0] : null;
    const folioHtml = folioSlug ? `<span class="badge" id="foliolink" title="Open folio" style="cursor:pointer; border-color:var(--accent); color:var(--accent);">📁 ${esc(folioSlug)}</span>` : "";
    view.innerHTML = `<div id="docmeta">
        <strong>${esc(d.title || d.slug)}</strong>
        ${folioHtml}
        <span class="badge">${esc(d.kind)}</span>
        <span>v${d.version}</span>
        <span>${human(d.size_bytes)}</span>
        <span>updated ${new Date(d.updated_at).toLocaleString()}</span>
        ${actor}
        ${tagsHtml}
        ${lock}${hist}${actions}
      </div><div id="histpanel"></div><div id="docbody">${body}</div>`;
    const hb = $("#histbtn");
    if (hb) hb.onclick = () => toggleHistory(id);
    const fl = $("#foliolink");
    if (fl) fl.onclick = () => showFolioFromDoc(folioSlug);
    const rb = $("#rawbtn");
    if (rb) rb.onclick = () => toggleRawView(id);
    const cb = $("#copybtn");
    if (cb) cb.onclick = copyDoc;
    const eb = $("#embedbtn");
    if (eb) eb.onclick = async () => { await writeClipboard(embedFor(d)).catch(() => {}); notify(`Embed markdown copied:<br><code>${esc(embedFor(d))}</code>`); };
    $("#attachbtn").onclick = pickFiles;
    activeDoc = d;
    hydrateFiles($("#docbody"));
    if (version && version !== d.version) viewRevision(id, version, d.version);
  } catch (e) {
    view.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    // A shared link can point at a doc that's gone (or that you can't read without
    // a token). Still populate the list, or the page is a dead end.
    loadList();
  }
}

// History stays deliberately light: a collapsible list of versions; clicking one
// renders that past version in place (no diff view). "back to latest" re-opens.
async function toggleHistory(id) {
  const panel = $("#histpanel");
  if (panel.innerHTML) { panel.innerHTML = ""; return; }
  panel.innerHTML = `<div class="lrow muted">loading history…</div>`;
  try {
    const { revisions } = await (await api("/docs/" + id + "/revisions")).json();
    const total = revisions.length;
    const byVersion = new Map(revisions.map(rv => [rv.version, rv]));
    panel.innerHTML = revisions.map((rv, i) =>
      `<div class="lrow" data-v="${rv.version}">
         <span class="badge${i === 0 ? " cur" : ""}">v${rv.version}${i === 0 ? " ·now" : ""}</span>
         <span>${esc(rv.author || "—")}</span>
         <span class="muted">${new Date(rv.created_at).toLocaleString()}</span>
         <span class="muted">${human(rv.size_bytes)}</span>
         ${rv.content_type && !isText(rv.content_type) ? `<span class="muted">${fileIcon(rv.content_type)} ${esc(rv.content_type)}</span>` : ""}
       </div>`).join("");
    panel.querySelectorAll(".lrow").forEach(el =>
      el.onclick = () => viewRevision(id, +el.dataset.v, total, el, byVersion.get(+el.dataset.v)));
  } catch (e) { panel.innerHTML = `<div class="lrow muted">${esc(e.message)}</div>`; }
}

// rev: that version's entry from /revisions ({content_type, size_bytes}); fetched
// when absent (a deep link). A doc's type can change between versions, so each
// version is shown as what it was, not as what the doc is now.
async function viewRevision(id, version, total, el, rev = null) {
  const panel = $("#histpanel");
  panel.querySelectorAll(".lrow").forEach(x => x.classList.remove("active"));
  if (el) el.classList.add("active");
  const bodyEl = $("#docbody");
  if (activeSlug) setRoute("#/doc/" + encSlug(activeSlug) + "?v=" + version);
  try {
    const banner = `<div class="oldbanner">Viewing <strong>v${version}</strong> of ${total} `
      + `— <a id="backlatest">back to latest</a></div>`;
    if (!rev) {
      const { revisions } = await (await api("/docs/" + id + "/revisions")).json();
      rev = revisions.find(r => r.version === version) || null;
    }
    const ct = rev && rev.content_type !== undefined ? rev.content_type : (activeDoc && activeDoc.content_type);
    if (!isText(ct)) {
      lastRaw = null;
      const meta = { ...(activeDoc || { slug: String(id) }), content_type: ct, size_bytes: rev ? rev.size_bytes : (activeDoc && activeDoc.size_bytes) };
      bodyEl.innerHTML = banner + attachmentView(meta, `/docs/${id}/revisions/${version}/raw${wsParam()}`);
      hydrateFiles(bodyEl);
      $("#backlatest").onclick = () => openDoc(id);
      return;
    }
    const raw = await (await api(`/docs/${id}/revisions/${version}/raw`)).text();
    lastRaw = raw; // the toggle re-renders whatever version is on screen
    bodyEl.innerHTML = banner + renderDoc(raw);
    hydrateFiles(bodyEl);
    $("#backlatest").onclick = () => openDoc(id);
  } catch (e) { bodyEl.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// The browser UI renders a human start/help page via DOM APIs (never innerHTML
// and never interpolating bearer tokens), while /llms.txt, /usage.md, and curl /
// serve web/usage.md for coding agents.
function makeEl(tag, className, parts) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (parts !== undefined) appendParts(node, parts);
  return node;
}

function appendParts(parent, parts) {
  if (!Array.isArray(parts)) parts = [parts];
  for (const part of parts) {
    if (part === null || part === undefined) continue;
    if (typeof part === "string") {
      parent.appendChild(document.createTextNode(part));
    } else if (part instanceof Node) {
      parent.appendChild(part);
    } else if (Array.isArray(part)) {
      const [tag, text, attrs] = part;
      const child = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) child.setAttribute(k, v);
      }
      if (text !== undefined && text !== null) child.textContent = text;
      parent.appendChild(child);
    }
  }
}

{

// Raw-markdown view: a global reading preference, persisted per browser, so it
// survives navigation between docs. renderDoc is the single place the flag is
// honoured — openDoc and viewRevision both go through it, so opening a past
// revision does not silently drop back to rendered. esc(), not DOMPurify:
// the default profile is lossy on source (it deletes HTML comments and an
// unclosed `<b` swallows the rest of the doc), which is wrong for verbatim.
let rawView = localStorage.getItem("tracker_raw_view") === "raw";
let lastRaw = null; // the raw text currently on screen (latest or a revision)
function renderDoc(raw) {
  return rawView
    ? `<pre class="rawview">${esc(raw)}</pre>`
    : `<div class="md">${DOMPurify.sanitize(marked.parse(raw))}</div>`;
}
function toggleRawView(id) {
  rawView = !rawView;
  localStorage.setItem("tracker_raw_view", rawView ? "raw" : "md");
  const rb = $("#rawbtn");
  if (rb) {
    rb.setAttribute("aria-checked", String(rawView));
    rb.title = rawView ? "Show rendered view" : "Show raw markdown";
  }
  resetCopyButton();
  if (lastRaw === null) return;
  const bodyEl = $("#docbody");
  if (!bodyEl) return;
  const banner = bodyEl.querySelector(".oldbanner");
  bodyEl.innerHTML = (banner ? banner.outerHTML : "") + renderDoc(lastRaw);
  hydrateFiles(bodyEl);
  const back = $("#backlatest");
  if (back) back.onclick = () => openDoc(id);
}

function resetCopyButton() {
  const button = $("#copybtn");
  if (!button) return;
  clearTimeout(button.copyResetTimer);
  button.textContent = "Copy";
  button.title = rawView ? "Copy raw markdown" : "Copy formatted text";
}

async function copyDoc() {
  const button = $("#copybtn");
  const content = $(rawView ? "#docbody .rawview" : "#docbody .md");
  if (!button || !content || lastRaw === null || button.copying) return;
  // Snapshot the visible version and mode before an asynchronous clipboard write.
  const text = rawView ? lastRaw : content.innerText;
  const html = rawView ? null : content.innerHTML;
  clearTimeout(button.copyResetTimer);
  button.copying = true;
  try {
    await writeClipboard(text, html);
    button.textContent = "Copied!";
  } catch {
    button.textContent = "Copy failed";
    button.title = "Select the document text and copy it manually.";
  } finally {
    button.copying = false;
    button.copyResetTimer = setTimeout(() => {
      if ($("#copybtn") === button) resetCopyButton();
    }, 2000);
  }
}

async function writeClipboard(text, html) {
  // The async API needs a secure context; the copy-event path also works on HTTP.
  try {
    if (html !== null && navigator.clipboard?.write && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([text], { type: "text/plain" }),
        "text/html": new Blob([html], { type: "text/html" }),
      })]);
      return;
    }
    if (html === null && navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
  } catch { /* A denied async write may still allow a user-initiated copy event. */ }

  const focused = document.activeElement;
  const selection = window.getSelection();
  const ranges = Array.from({ length: selection.rangeCount }, (_, i) => selection.getRangeAt(i).cloneRange());
  const field = document.createElement("textarea");
  field.value = text;
  field.readOnly = true;
  field.style.cssText = "position:fixed;left:-9999px;top:0;";
  let handled = false;
  const onCopy = event => {
    if (!event.clipboardData) return;
    event.clipboardData.setData("text/plain", text);
    if (html !== null) event.clipboardData.setData("text/html", html);
    event.preventDefault();
    handled = true;
  };
  document.body.appendChild(field);
  document.addEventListener("copy", onCopy);
  try {
    field.select();
    if (!document.execCommand("copy") || !handled) throw new Error("Clipboard copy failed");
  } finally {
    document.removeEventListener("copy", onCopy);
    field.remove();
    focused?.focus({ preventScroll: true });
    selection.removeAllRanges();
    ranges.forEach(range => selection.addRange(range));
  }
}

marked.setOptions({ gfm: true, breaks: false });
// Same-origin images in markdown never load bare: their source moves to
// data-file so hydrateFiles fetches them with the UI's headers. A bare <img>
// would send no token or actor, and on gated servers fail before we could swap it.
DOMPurify.addHook("afterSanitizeAttributes", n => {
  const src = n.tagName === "IMG" ? n.getAttribute("src") : null;
  if (src && sameOriginFile(src)) { n.setAttribute("data-file", withWorkspace(src)); n.removeAttribute("src"); }
});
// Start by loading workspaces, then let the URL route open the target item.
(async () => {
  await loadWorkspaces();
  applyRoute();
})();
</script>
