# Forgejo mirror CI: test against a Postgres service on the job network, then
# build an image on a runner with Docker socket access. Images remain local to
# the runner; the GitHub workflow publishes to GHCR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tracker_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no cache server on a plain runner; the warning costs more than the download
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/tracker_test?sslmode=disable
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git describe works
      - name: build image
        run: |
          set -euo pipefail
          version=$(git describe --tags --always --dirty)
          echo "building tracker:ci-${version}"
          docker build --build-arg VERSION="${version}" -t "tracker:ci-${version}" .
          docker image inspect "tracker:ci-${version}" --format 'OK {{.Id}} ({{.Size}} bytes)'
